name: ci

# saas-identity-platform-springboot (Java 17 + Spring Boot 3.4 fat jar)
# 推送链:
# - branch push(master/main) → 只跑 test（对齐门禁 L1-L4）
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1) → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持。
# 路径与姊妹仓 saas-identity-platform-{react,nextjs} 同款 (镜像 react ci.yml)。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: L1 spotless
        run: mvn -q spotless:check
      - name: L2 spotbugs
        run: mvn -q spotbugs:check
      - name: L3 compile
        run: mvn -q -DskipTests compile
      - name: L4 test
        run: mvn -q test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 总是重拉最新 deploy 脚本（与 nextjs ci.yml 同）；脚本 bug fix 立即生效
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            # springboot 额外拉 nginx-vps.conf.example（deploy 脚本自举 nginx vhost 用）
            if [ ! -f "nginx-vps.conf.example" ] && [ ! -d deploy ]; then
              curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/nginx-vps.conf.example" -o "nginx-vps.conf.example" || true
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
