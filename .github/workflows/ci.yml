name: ci

# 门禁镜像：与 .harness/stack.json 的 L1-L4 一致（test-only）。
# 本仓无 Docker 镜像 / VPS 部署 -- 旧版 ci.yml 是从
# lab-management-system-nextjs 错抄的 deploy 链，已删。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: L1 spotless
        run: mvn -q spotless:check
      - name: L2 spotbugs
        run: mvn -q spotbugs:check
      - name: L3 compile
        run: mvn -q -DskipTests compile
      - name: L4 test
        run: mvn -q test
