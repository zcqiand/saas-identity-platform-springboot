server:
  port: 8080
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com

  # M09.Database — PostgreSQL + Flyway (ADR-0007)
  # 默认指向 saas_dev (100.79.128.25)；可通过 SAAS_DB=saas_test / saas_prod 切换。
  # SPRING_DATASOURCE_URL/JDBC_URL/SAAS_DB 三选一覆盖（见 scripts/lib/db-env.sh）。
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_URL:jdbc:postgresql://100.79.128.25:5432/saas_dev}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:qiand68+++}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the DDL; Hibernate must NOT touch schema (validate = 「镜像 SQL 必须与 Entity 一致」)
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false