server:
  port: 8080

# Spring Security OAuth2 resource server 配置：SecurityConfig.jwtDecoder() 用 JWT_SIGNING_KEY
# 构造 NimbusJwtDecoder.withSecretKey()（HS256 真验签，Phase 2 起）。
# Production：把 JWT_SIGNING_KEY 替换为 issuer-uri，让 Spring Boot 自动配置 NimbusJwtDecoder 走 JWKS；
# 同时 SecurityConfig.jwtDecoder() bean 用 @Profile("!prod") 限定或直接删除。
# spring:
#   security:
#     oauth2:
#       resourceserver:
#         jwt:
#           issuer-uri: https://your-real-issuer.example.com

spring:
  # M09.Database — PostgreSQL + Flyway (ADR-0007)
  # 默认指向 saas_dev (100.79.128.25)；可通过 DATABASE_NAME=saas_test / saas_prod 切换。
  # DATABASE_URL/JDBC_URL/DATABASE_NAME 三选一覆盖（见 scripts/lib/db-env.sh）。
  datasource:
    url: ${DATABASE_URL:${JDBC_URL:jdbc:postgresql://100.79.128.25:5432/saas_dev}}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:qiand68+++}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the DDL. Hibernate 用 ddl-auto=none 不参与 schema 管理：
      #   - validate 模式撞 UuidArrayConverter bug（List<UUID> ↔ uuid[] 映射，Hibernate 6 schema
      #     validator 不认 AttributeConverter<…, UUID[]>，启动会跑 information_schema 抛 PSQLException）。
      #     这是已知债，Phase 6 再修（改成 @Type(UUIDArrayType.class) 而不是 @Convert）。
      #   - update 会和 Flyway 抢 DDL，违反 ADR-0007「Flyway owns DDL」原则。
      #   - none 让 Hibernate 完全跳过 schema 校验；运行时 SQL 仍由 converter 处理。
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC

  flyway:
    # Dev unblock：直接关 Flyway。saas_dev schema 已经被 AspNetCore + shared SQL 灌过，
    # Spring Boot 仓的 V001-V008 SQL 文件对 saas_dev 是 redundant（也会撞 already exists），
    # Flyway baseline-on-migrate + baseline-version 组合在 10.20.1 没干净跳过 V00X 的可靠路径。
    # 关掉 Flyway 后 schema 由 shared SQL 单一来源管理（CLAUDE.md ADR-0007），本仓只读不写。
    # Hibernate ddl-auto=none 也跳过校验，运行时由 UuidArrayType 等 UserType 处理 uuid[] 等列。
    # TODO Phase 6：用 testcontainers + 干净 saas_test 启 Flyway 做 schema 漂移检测；或者把 V00X 改成 idempotent (IF NOT EXISTS) 让 Flyway baseline-on-migrate=true 真的能跳过。
    enabled: false

# /actuator/health 暴露给 Docker HEALTHCHECK 探针（"应用真的在服务"vs"端口开着"）。
# probes (liveness/readiness) 开启：Kubernetes/容器编排能区分"应用还在跑但还没就绪"vs"真挂了"。
# 只暴露 health 一个 endpoint，避免暴露 metrics/env/heapdump 等敏感面。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
